<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sheet Gem app icon (Jewels by Juls). Source for build/icon.png. -->
  <defs>
    <!-- White melamine board -->
    <linearGradient id="board" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8F6F1"/>
      <stop offset="1" stop-color="#E6E2D8"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#B5AE9F" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
    </filter>

    <!-- Pink cutting mat -->
    <linearGradient id="mat" x1="168" y1="168" x2="856" y2="856" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3B1C4"/>
      <stop offset="0.5" stop-color="#EC9CB4"/>
      <stop offset="1" stop-color="#E28BA6"/>
    </linearGradient>
    <pattern id="grid" patternUnits="userSpaceOnUse" x="168" y="168" width="172" height="172">
      <g stroke="#FFFFFF" fill="none">
        <path stroke-opacity="0.3" stroke-width="3" d="M34.4 0V172M68.8 0V172M103.2 0V172M137.6 0V172M0 34.4H172M0 68.8H172M0 103.2H172M0 137.6H172"/>
        <path stroke-opacity="0.65" stroke-width="7" d="M0 0V172M0 0H172"/>
      </g>
    </pattern>
    <clipPath id="matClip"><rect x="168" y="168" width="688" height="688" rx="122"/></clipPath>
    <linearGradient id="recess" x1="0" y1="164" x2="0" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A6B76" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#9A6B76" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dy="10" result="off"/>
      <feComposite in="SourceAlpha" in2="off" operator="arithmetic" k2="1" k3="-1" result="rim"/>
      <feFlood flood-color="#7A2E48" flood-opacity="0.4"/>
      <feComposite operator="in" in2="rim"/>
    </filter>

    <!-- Paper sheet -->
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="3" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gem -->
    <filter id="dropGem" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/>
      <feOffset in="b" dy="16" result="o"/>
      <feFlood flood-color="#4A2A10" flood-opacity="0.45"/>
      <feComposite operator="in" in2="o"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sheen" x1="292" y1="345" x2="732" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A2600" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile shadow + white melamine body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000" filter="url(#tileShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#board)"/>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="url(#bevel)" stroke-width="8"/>

  <!-- Inset pink cutting mat -->
  <rect x="164" y="164" width="696" height="696" rx="126" fill="none" stroke="url(#recess)" stroke-width="8"/>
  <g clip-path="url(#matClip)">
    <rect x="168" y="168" width="688" height="688" fill="url(#mat)"/>
    <rect x="168" y="168" width="688" height="688" fill="url(#grid)"/>
    <rect x="168" y="168" width="688" height="688" rx="122" fill="#FFFFFF" filter="url(#innerShadow)"/>
  </g>

  <!-- Pattern sheet with folded corner -->
  <g id="paper" transform="rotate(-4 512 512)" filter="url(#paperShadow)">
    <path d="M292 236H648L732 320V792H292Z" fill="#FFFFFF"/>
    <path d="M648 236V320H732Z" fill="#E4DED2"/>
  </g>

  <!-- Faceted gold gem -->
  <g filter="url(#dropGem)" stroke-linejoin="round" transform="translate(512 512) scale(1.08) translate(-512 -522)">
    <!-- crown -->
    <path d="M362 345L292 440L402 440Z" fill="#FFF1B0"/>
    <path d="M362 345L462 345L402 440Z" fill="#E9C75A"/>
    <path d="M462 345L402 440L512 440Z" fill="#FFF1B0"/>
    <path d="M462 345L562 345L512 440Z" fill="#E9C75A"/>
    <path d="M562 345L512 440L622 440Z" fill="#C4952F"/>
    <path d="M562 345L662 345L622 440Z" fill="#E9C75A"/>
    <path d="M662 345L622 440L732 440Z" fill="#C4952F"/>
    <!-- pavilion -->
    <path d="M292 440L347 440L512 700Z" fill="#E9C75A"/>
    <path d="M347 440L402 440L512 700Z" fill="#FFF1B0"/>
    <path d="M402 440L457 440L512 700Z" fill="#C4952F"/>
    <path d="M457 440L512 440L512 700Z" fill="#E9C75A"/>
    <path d="M512 440L567 440L512 700Z" fill="#8A6514"/>
    <path d="M567 440L622 440L512 700Z" fill="#C4952F"/>
    <path d="M622 440L677 440L512 700Z" fill="#8A6514"/>
    <path d="M677 440L732 440L512 700Z" fill="#B38625"/>
    <!-- metallic sheen -->
    <path d="M362 345H662L732 440L512 700L292 440Z" fill="url(#sheen)"/>
    <!-- facet edges -->
    <path d="M347 440L512 700M457 440L512 700M567 440L512 700M677 440L512 700"
          fill="none" stroke="#FFF6CF" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M292 440H732M362 345L402 440L462 345L512 440L562 345L622 440L662 345M402 440L512 700L622 440M512 440V700"
          fill="none" stroke="#FFF6CF" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round"/>
    <path d="M362 345H662L732 440L512 700L292 440Z" fill="none" stroke="#6E4E0C" stroke-width="8"/>
  </g>

  <!-- Sparkles -->
  <circle cx="640" cy="365" r="70" fill="url(#glow)"/>
  <path d="M640 303Q647 358 702 365Q647 372 640 427Q633 372 578 365Q633 358 640 303Z" fill="#FFFFFF"/>
  <circle cx="240" cy="636" r="44" fill="url(#glow)"/>
  <path d="M240 598Q244 632 278 636Q244 640 240 674Q236 640 202 636Q236 632 240 598Z" fill="#FFFFFF"/>
</svg>
